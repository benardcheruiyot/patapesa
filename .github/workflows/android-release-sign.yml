name: Build & Sign Android AAB (canonical)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag'
        required: false

env:
  ANDROID_SDK_ROOT: /usr/local/android-sdk

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools (minimal)
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          wget --no-verbose https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Decode upload keystore from secret (secure)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Write android/key.properties pointing to the upload keystore
        env:
          UPLOAD_KEYSTORE_STOREPASS: ${{ secrets.UPLOAD_KEYSTORE_STOREPASS }}
          UPLOAD_KEYSTORE_KEYPASS: ${{ secrets.UPLOAD_KEYSTORE_KEYPASS }}
          UPLOAD_KEYSTORE_ALIAS: ${{ secrets.UPLOAD_KEYSTORE_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
storePassword=${{ secrets.UPLOAD_KEYSTORE_STOREPASS }}
keyPassword=${{ secrets.UPLOAD_KEYSTORE_KEYPASS }}
keyAlias=${{ secrets.UPLOAD_KEYSTORE_ALIAS }}
storeFile=app/upload-keystore.jks
EOF

      - name: Make Gradle wrapper executable
        run: |
          chmod +x android/gradlew

      - name: Build signed AAB (bundleRelease)
        working-directory: android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify AAB signature with apksigner
        run: |
          AAB_PATH=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB_PATH" ]; then echo "AAB not found at $AAB_PATH" && exit 1; fi
          echo "Verifying signature contents (apksigner):"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --print-certs "$AAB_PATH" > signed-verification.txt || true
          cat signed-verification.txt
        shell: bash

      - name: Compute SHA-256 checksum
        run: |
          AAB_PATH=android/app/build/outputs/bundle/release/app-release.aab
          sha256sum "$AAB_PATH" > aab-sha256.txt
          cat aab-sha256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            signed-verification.txt
            aab-sha256.txt

      - name: Clean decoded keystore
        run: |
          shred -u android/app/upload-keystore.jks || rm -f android/app/upload-keystore.jks || true
          rm -f android/key.properties || true
