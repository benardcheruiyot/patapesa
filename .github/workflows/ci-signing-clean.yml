name: CI Signing Clean (minimal)

on:
  workflow_dispatch:

jobs:
  ci-signing-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Decode keystore (from secrets)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_STOREPASS: ${{ secrets.UPLOAD_KEYSTORE_STOREPASS }}
          UPLOAD_KEYSTORE_KEYPASS: ${{ secrets.UPLOAD_KEYSTORE_KEYPASS }}
          UPLOAD_KEYSTORE_ALIAS: ${{ secrets.UPLOAD_KEYSTORE_ALIAS }}
        run: |
          mkdir -p android/app
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${UPLOAD_KEYSTORE_STOREPASS}
          keyPassword=${UPLOAD_KEYSTORE_KEYPASS}
          keyAlias=${UPLOAD_KEYSTORE_ALIAS}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Regenerate Metro bundle (deterministic)
        run: |
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
